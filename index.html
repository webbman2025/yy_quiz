<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>YY Mobile 每日小測</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              yellow: '#f9ed32',
              green: '#5cc5c1',
              teal: '#12c1c3',
              border: '#e1e0d7',
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', '"Noto Sans HK"', 'sans-serif'],
          },
          boxShadow: {
            option: '0 0 10px rgba(154, 229, 227, 0.8)',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --app-max-width: 100%;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (min-width: 431px) { :root { --app-max-width: 430px; } }
    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: 'Noto Sans TC', 'Noto Sans HK', sans-serif;
      width: 100%;
      min-height: 100dvh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
    }
    .page-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: var(--app-max-width);
      min-height: 100dvh;
      min-height: 100svh;
      margin-inline: auto;
    }
    .app-scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    .sticky-cta-bar {
      flex-shrink: 0;
      z-index: 50;
      padding: 12px 20px calc(12px + var(--safe-bottom));
      background: #fff;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.08);
    }
    .sticky-cta-bar[hidden] { display: none !important; }
    .sticky-cta-bar__inner {
      width: 100%;
    }
    .ink-bg-top {
      background-image: url('images/watercolor.png');
      background-size: min(75vw, 280px) auto;
      background-repeat: no-repeat;
      background-position: top right;
    }
    .ink-bg-bottom {
      background-image: url('images/ink-graphic.png');
      background-size: min(85vw, 320px) auto;
      background-repeat: no-repeat;
      background-position: bottom left;
    }
  </style>
</head>
<body class="bg-white text-black antialiased">
  <div class="page-shell ink-bg-top ink-bg-bottom">
    <div class="app-scroll">
      <main class="relative z-10 flex flex-col px-5 pb-6 pt-10 sm:px-6">
      <div class="mb-6 inline-flex items-center gap-2 self-center rounded-full bg-brand-teal/10 px-4 py-1.5 text-sm font-bold text-brand-teal">
        <span aria-hidden="true">✦</span>
        <span>每日小測</span>
        <span aria-hidden="true">✦</span>
      </div>

      <h1 class="mb-4 text-center text-[28px] font-bold leading-tight">
        中文知識<br>挑戰測驗
      </h1>

      <p class="mb-8 text-center text-base leading-relaxed text-gray-700">
        三週挑戰，每週 5 道固定題目，<br>
        每次測驗題目順序隨機。<br>
        準備好了嗎？
      </p>

      <ul class="mb-10 space-y-3 rounded-[20px] bg-white/80 p-5 shadow-option">
        <li class="flex items-start gap-3 text-sm leading-relaxed">
          <span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-brand-teal text-xs font-bold text-white">1</span>
          <span>第 1–3 週各 5 題，本週題目固定不變</span>
        </li>
        <li class="flex items-start gap-3 text-sm leading-relaxed">
          <span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-brand-teal text-xs font-bold text-white">2</span>
          <span>選答後即時顯示正確與否</span>
        </li>
        <li class="flex items-start gap-3 text-sm leading-relaxed">
          <span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-brand-teal text-xs font-bold text-white">3</span>
          <span>完成後查看成績及詳細解析</span>
        </li>
      </ul>
      </main>
    </div>

    <div class="sticky-cta-bar">
      <div class="sticky-cta-bar__inner">
        <a
          href="quiz.html"
          class="flex w-full items-center justify-center rounded-full border-b-2 border-l-2 border-brand-green bg-brand-yellow px-8 py-3.5 text-xl font-bold text-black transition hover:brightness-95 active:scale-[0.99] sm:text-[26px]"
        >
          開始測驗
        </a>
      </div>
    </div>
  </div>
</body>
</html>
