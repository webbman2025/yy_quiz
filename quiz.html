<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YY Mobile 每日小測</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              yellow: '#f9ed32',
              green: '#5cc5c1',
              teal: '#12c1c3',
              border: '#e1e0d7',
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', '"Noto Sans HK"', 'sans-serif'],
          },
          boxShadow: {
            option: '0 0 10px rgba(154, 229, 227, 0.8)',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Noto Sans TC', 'Noto Sans HK', sans-serif; }
    .ink-bg-top::before,
    .ink-bg-bottom::after {
      content: '';
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      mix-blend-mode: multiply;
    }
    .ink-bg-top::before {
      top: 120px;
      right: -40px;
      width: 280px;
      height: 180px;
      background: url('images/watercolor.png') no-repeat center / contain;
    }
    .ink-bg-bottom::after {
      bottom: 80px;
      left: -60px;
      width: 320px;
      height: 190px;
      background: url('images/ink-graphic.png') no-repeat center / contain;
    }
    .option-btn:not(:disabled):hover { border-color: #12c1c3; }
    .view[hidden] { display: none !important; }
  </style>
</head>
<body class="min-h-screen bg-white text-black antialiased ink-bg-top ink-bg-bottom">
  <div class="relative z-10 mx-auto flex min-h-screen max-w-[375px] flex-col">
    <!-- Header -->
    <header class="border-b border-brand-border px-4 py-3">
      <div class="flex items-center justify-between">
        <a href="index.html" class="text-sm font-bold text-brand-teal" aria-label="返回首頁">← 返回</a>
        <p class="text-sm font-bold text-brand-teal">每日小測</p>
        <span class="w-10"></span>
      </div>
    </header>

    <!-- Quiz View -->
    <section id="quizView" class="view flex flex-1 flex-col pb-28">
      <div id="progressBar" class="flex items-center justify-center gap-[11px] px-5 py-5"></div>

      <p id="progressText" class="mb-2 text-center text-sm font-bold text-brand-teal">1/5</p>

      <div class="px-5">
        <ol id="questionNumber" class="mb-4 list-decimal pl-6 text-lg font-bold leading-[26px]">
          <li id="questionText"></li>
        </ol>
      </div>

      <div id="optionsContainer" class="flex flex-col items-center gap-4 px-5 py-5"></div>

      <div id="feedbackBox" class="mx-5 hidden rounded-[20px] px-4 py-3 text-sm leading-relaxed"></div>

      <div class="fixed bottom-0 left-1/2 w-full max-w-[375px] -translate-x-1/2 bg-gradient-to-t from-white via-white to-transparent px-7 pb-6 pt-4">
        <div class="flex gap-3">
          <button
            id="prevBtn"
            type="button"
            class="hidden flex-1 rounded-full border-2 border-brand-teal bg-white py-3 text-base font-bold text-brand-teal transition hover:bg-brand-teal/5"
          >
            上一題
          </button>
          <button
            id="nextBtn"
            type="button"
            disabled
            class="flex-[2] rounded-full border-b-2 border-l-2 border-brand-green bg-brand-yellow py-3.5 text-xl font-bold text-black transition enabled:hover:brightness-95 disabled:cursor-not-allowed disabled:opacity-40"
          >
            下一題
          </button>
        </div>
      </div>
    </section>

    <!-- Results View -->
    <section id="resultsView" class="view flex flex-1 flex-col px-5 pb-10 pt-6" hidden>
      <h2 class="mb-2 text-center text-2xl font-bold">測驗結果</h2>
      <p id="scoreSummary" class="mb-6 text-center text-xl font-bold text-brand-teal"></p>

      <div class="mb-6 rounded-[20px] bg-white/80 p-4 shadow-option">
        <p class="mb-3 text-sm font-bold">答題摘要</p>
        <div id="summaryList" class="space-y-2"></div>
      </div>

      <div class="mt-auto flex flex-col gap-3">
        <button
          id="restartBtn"
          type="button"
          class="w-full rounded-full border-b-2 border-l-2 border-brand-green bg-brand-yellow py-3.5 text-xl font-bold text-black transition hover:brightness-95"
        >
          重新測驗
        </button>
        <a
          href="index.html"
          class="flex w-full items-center justify-center rounded-full border-2 border-brand-teal bg-white py-3 text-base font-bold text-brand-teal transition hover:bg-brand-teal/5"
        >
          返回首頁
        </a>
      </div>
    </section>

    <!-- Review View -->
    <section id="reviewView" class="view flex flex-1 flex-col pb-28" hidden>
      <div class="border-b border-brand-border px-5 py-4">
        <button id="backToResultsBtn" type="button" class="text-sm font-bold text-brand-teal">← 返回結果</button>
        <p id="reviewProgressText" class="mt-2 text-center text-sm font-bold text-brand-teal"></p>
      </div>

      <div class="px-5 pt-4">
        <ol class="mb-4 list-decimal pl-6 text-lg font-bold leading-[26px]">
          <li id="reviewQuestionText"></li>
        </ol>
      </div>

      <div id="reviewOptionsContainer" class="flex flex-col items-center gap-4 px-5 py-5"></div>
      <div id="reviewFeedbackBox" class="mx-5 rounded-[20px] px-4 py-3 text-sm leading-relaxed"></div>
    </section>
  </div>

  <script src="questions.js"></script>
  <script>
    const QUIZ_SIZE = 5;
    const LABELS = ['A', 'B', 'C', 'D'];

    const state = {
      sessionQuestions: [],
      currentIndex: 0,
      answers: {},
      mode: 'quiz',
    };

    const quizView = document.getElementById('quizView');
    const resultsView = document.getElementById('resultsView');
    const reviewView = document.getElementById('reviewView');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackBox = document.getElementById('feedbackBox');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const scoreSummary = document.getElementById('scoreSummary');
    const summaryList = document.getElementById('summaryList');
    const restartBtn = document.getElementById('restartBtn');
    const backToResultsBtn = document.getElementById('backToResultsBtn');
    const reviewProgressText = document.getElementById('reviewProgressText');
    const reviewQuestionText = document.getElementById('reviewQuestionText');
    const reviewOptionsContainer = document.getElementById('reviewOptionsContainer');
    const reviewFeedbackBox = document.getElementById('reviewFeedbackBox');

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pickRandomQuestions() {
      return shuffle(QUESTION_BANK).slice(0, QUIZ_SIZE);
    }

    function getCurrentQuestion() {
      return state.sessionQuestions[state.currentIndex];
    }

    function isAnswered(index = state.currentIndex) {
      return Object.prototype.hasOwnProperty.call(state.answers, index);
    }

    function getSelectedLabel(index = state.currentIndex) {
      return state.answers[index] ?? null;
    }

    function isCorrect(question, label) {
      return label === question.correct;
    }

    function countCorrectAnswers() {
      return state.sessionQuestions.reduce((total, question, index) => {
        return total + (isCorrect(question, state.answers[index]) ? 1 : 0);
      }, 0);
    }

    function showView(viewName) {
      state.mode = viewName;
      quizView.hidden = viewName !== 'quiz';
      resultsView.hidden = viewName !== 'results';
      reviewView.hidden = viewName !== 'review';
    }

    function renderProgressBar() {
      progressBar.innerHTML = '';
      for (let i = 0; i < QUIZ_SIZE; i += 1) {
        const step = document.createElement('button');
        step.type = 'button';
        step.setAttribute('aria-label', `第 ${i + 1} 題`);
        step.className = [
          'flex h-[21px] w-[21px] items-center justify-center rounded-full text-[11px] font-bold leading-none transition',
          i === state.currentIndex
            ? 'bg-brand-teal text-white'
            : isAnswered(i)
              ? 'border-2 border-brand-teal bg-brand-teal/15 text-brand-teal'
              : 'border-2 border-brand-teal text-brand-teal',
        ].join(' ');
        step.textContent = String(i + 1);
        step.addEventListener('click', () => {
          if (state.mode !== 'quiz') return;
          if (i <= state.currentIndex || isAnswered(i)) {
            state.currentIndex = i;
            renderQuiz();
          }
        });
        progressBar.appendChild(step);
      }
    }

    function optionClasses(question, selectedLabel, optionLabel, interactive) {
      const classes = [
        'option-btn w-full max-w-[320px] rounded-[20px] bg-white/80 p-3 text-left text-[18px] leading-normal shadow-option transition',
      ];

      if (!interactive) {
        if (optionLabel === question.correct) {
          classes.push('border-2 border-green-500 bg-green-50');
        } else if (selectedLabel === optionLabel && optionLabel !== question.correct) {
          classes.push('border-2 border-red-500 bg-red-50');
        } else {
          classes.push('border-2 border-transparent');
        }
        return classes.join(' ');
      }

      if (selectedLabel) {
        if (optionLabel === question.correct) {
          classes.push('border-2 border-green-500 bg-green-50');
        } else if (selectedLabel === optionLabel) {
          classes.push('border-2 border-red-500 bg-red-50');
        } else {
          classes.push('border-2 border-transparent opacity-70');
        }
      } else {
        classes.push('border-2 border-transparent cursor-pointer');
      }

      return classes.join(' ');
    }

    function buildOptionButton(question, option, selectedLabel, interactive, onSelect) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = optionClasses(question, selectedLabel, option.label, interactive);
      button.disabled = !interactive || Boolean(selectedLabel);
      button.innerHTML = `<span class="font-bold">${option.label}. </span><span>${option.text}</span>`;
      if (interactive && !selectedLabel) {
        button.addEventListener('click', () => onSelect(option.label));
      }
      return button;
    }

    function renderFeedback(question, selectedLabel, target) {
      const correct = isCorrect(question, selectedLabel);
      target.classList.remove('hidden', 'border-green-500', 'bg-green-50', 'text-green-800', 'border-red-500', 'bg-red-50', 'text-red-800', 'border');
      target.classList.add('border');

      if (correct) {
        target.classList.add('border-green-500', 'bg-green-50', 'text-green-800');
        target.innerHTML = `
          <p class="mb-1 text-base font-bold">正確</p>
          ${question.explanation ? `<p>${question.explanation}</p>` : '<p>答得好！</p>'}
        `;
      } else {
        target.classList.add('border-red-500', 'bg-red-50', 'text-red-800');
        const correctOption = question.options.find((item) => item.label === question.correct);
        target.innerHTML = `
          <p class="mb-1 text-base font-bold">錯誤</p>
          <p>正確答案：<span class="font-bold">${question.correct}. ${correctOption.text}</span></p>
          ${question.explanation ? `<p class="mt-2">${question.explanation}</p>` : ''}
        `;
      }
    }

    function renderQuiz() {
      const question = getCurrentQuestion();
      const selectedLabel = getSelectedLabel();

      renderProgressBar();
      progressText.textContent = `${state.currentIndex + 1}/${QUIZ_SIZE}`;
      questionText.innerHTML = question.question;

      optionsContainer.innerHTML = '';
      question.options.forEach((option) => {
        optionsContainer.appendChild(
          buildOptionButton(question, option, selectedLabel, true, (label) => {
            state.answers[state.currentIndex] = label;
            renderQuiz();
          })
        );
      });

      if (selectedLabel) {
        feedbackBox.classList.remove('hidden');
        renderFeedback(question, selectedLabel, feedbackBox);
      } else {
        feedbackBox.classList.add('hidden');
        feedbackBox.innerHTML = '';
      }

      prevBtn.classList.toggle('hidden', state.currentIndex === 0);
      nextBtn.disabled = !selectedLabel;
      nextBtn.textContent = state.currentIndex === QUIZ_SIZE - 1 ? '查看結果' : '下一題';
    }

    function renderResults() {
      const correctCount = countCorrectAnswers();
      const percentage = Math.round((correctCount / QUIZ_SIZE) * 100);
      scoreSummary.textContent = `${correctCount}/${QUIZ_SIZE} 正確 • ${percentage}%`;

      summaryList.innerHTML = '';
      state.sessionQuestions.forEach((question, index) => {
        const selected = getSelectedLabel(index);
        const correct = isCorrect(question, selected);
        const item = document.createElement('button');
        item.type = 'button';
        item.className = [
          'flex w-full items-start gap-3 rounded-[16px] border px-3 py-3 text-left transition hover:brightness-95',
          correct ? 'border-green-400 bg-green-50' : 'border-red-400 bg-red-50',
        ].join(' ');
        item.innerHTML = `
          <span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-bold text-white ${correct ? 'bg-green-500' : 'bg-red-500'}">${index + 1}</span>
          <span class="flex-1 text-sm leading-relaxed">
            <span class="font-bold ${correct ? 'text-green-700' : 'text-red-700'}">${correct ? '正確' : '錯誤'}</span>
            <span class="mt-1 block text-black">${stripHtml(question.question).slice(0, 48)}${stripHtml(question.question).length > 48 ? '…' : ''}</span>
          </span>
        `;
        item.addEventListener('click', () => {
          state.currentIndex = index;
          renderReview();
          showView('review');
        });
        summaryList.appendChild(item);
      });

      showView('results');
    }

    function renderReview() {
      const question = getCurrentQuestion();
      const selectedLabel = getSelectedLabel(state.currentIndex);

      reviewProgressText.textContent = `第 ${state.currentIndex + 1} 題 / 共 ${QUIZ_SIZE} 題`;
      reviewQuestionText.innerHTML = question.question;

      reviewOptionsContainer.innerHTML = '';
      question.options.forEach((option) => {
        reviewOptionsContainer.appendChild(
          buildOptionButton(question, option, selectedLabel, false, null)
        );
      });

      renderFeedback(question, selectedLabel, reviewFeedbackBox);
    }

    function stripHtml(html) {
      const temp = document.createElement('div');
      temp.innerHTML = html;
      return temp.textContent || temp.innerText || '';
    }

    function startQuiz() {
      state.sessionQuestions = pickRandomQuestions();
      state.currentIndex = 0;
      state.answers = {};
      showView('quiz');
      renderQuiz();
    }

    prevBtn.addEventListener('click', () => {
      if (state.currentIndex > 0) {
        state.currentIndex -= 1;
        renderQuiz();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (!isAnswered()) return;

      if (state.currentIndex < QUIZ_SIZE - 1) {
        state.currentIndex += 1;
        renderQuiz();
      } else {
        renderResults();
      }
    });

    restartBtn.addEventListener('click', startQuiz);
    backToResultsBtn.addEventListener('click', () => showView('results'));

    startQuiz();
  </script>
</body>
</html>
